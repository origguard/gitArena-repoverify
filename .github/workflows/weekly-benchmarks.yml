name: Weekly Public Benchmarks

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Seed SQLite database
        run: npm run seed

      - name: Regenerate Markdown & JSON benchmark reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/studio/benchmark-publisher.mjs --no-pdf

      - name: Commit and push updated benchmarks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/
          git diff --cached --quiet || (git commit -m "chore(benchmarks): weekly automated tournament refresh" && git push)
