name: RepoVerify / GitArena CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Seed SQLite WAL + FTS5 database
        run: npm run seed

      - name: Check frontend JavaScript syntax
        run: node --check src/public/js/app.js

      - name: Run full E2E verification harness
        run: npm test
